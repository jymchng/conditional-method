[project]
name = "python-cfg"
dynamic = ["version"]
description = "A decorator `@cfg` that selects a method implementation (among those that are identically named) for a class during class build time, leaving only the selected method in its attributes set when the class is built, i.e. 'well-formed'."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name="Jim Chng", email="jimchng@outlook.com" }
]
dependencies = []

[project.urls]
Repository = "https://github.com/jymchng/conditional-method"
Documentation = "https://jymchng.github.io/conditional-method/"

[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["cfg"]

[tool.setuptools.package-data]
cfg = ["py.typed"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.2.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "nox>=2025.2.9",
    "ruff>=0.9.9",
    "tomli>=2.0.1",
]
test = [
    "pytest>=8.3.4",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100",
]
examples = [
    "fastapi>=0.115.10",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pyjwt>=2.9.0",
]
build = [
    "setuptools>=68",
    "wheel",
    "setuptools-scm>=8",
]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
# examples/ is demo code using intentional FastAPI idioms (Depends() in
# defaults, B904/B008/E501/E402); tests/ is excluded from lint by design.
exclude = ["tests/", "examples/"]

[tool.ruff.lint]
ignore = ["F811"]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# noxfile.py is a build-tooling file: mutable `{}` sentinel defaults (B006),
# an unused loop var (B007) and long logging lines (E501) are intentional.
"noxfile.py" = ["B006", "B007", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
files = ["src/cfg"]
exclude = ["src/cfg/_c.c"]

[[tool.mypy.overrides]]
module = "cfg._c"
ignore_missing_imports = true

[tool.coverage.run]
source = ["cfg"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.cibuildwheel]
build = "cp39-*"
archs = ["x86_64", "aarch64", "i686", "ppc64le", "s390x", "armv7l"]

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64", "i686", "ppc64le", "s390x", "armv7l"]

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64", "x86"]
