[project]
name = "conditional-method"
dynamic = ["version"]
description = "A decorator `@cfg` that selects a method implementation (among those that are identically named) for a class during class build time, leaving only the selected method in its attributes set when the class is built, i.e. 'well-formed'."
readme = "README.md"
requires-python = ">=3.9"
# PEP 639 licence metadata.
#
# PyPI publishes these as the `license_expression` field of its JSON API, and
# that field is what the shields.io `pypi/l` badge reads (it falls back to a
# free-text `license` string, then to `License ::` trove classifiers).  Without
# it the badge renders a red "license | missing".
#
# Do NOT also add a `License :: OSI Approved :: MIT License` classifier: PEP 639
# deprecates it, and setuptools >= 77 errors when an SPDX expression and a
# licence classifier are declared together.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["decorator", "conditional", "method-selection", "metaprogramming"]
# Trove classifiers.  The `Programming Language :: Python :: X.Y` entries are
# what the shields.io `pypi/pyversions` badge parses -- it never looks at
# `requires-python`, so an empty classifier list makes that badge render a red
# "python | missing" as well.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
authors = [
    { name="Jim Chng", email="jimchng@outlook.com" }
]
dependencies = []

[project.urls]
Repository = "https://github.com/jymchng/conditional-method"
Documentation = "https://jymchng.github.io/conditional-method/"

[build-system]
# setuptools >= 77 is required for PEP 639 (`project.license` as an SPDX
# expression + `project.license-files`).
requires = ["setuptools>=77", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["conditional_method", "cfg"]

[tool.setuptools.package-data]
conditional_method = ["py.typed", "__init__.pyi"]
cfg = ["py.typed"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.2.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "nox>=2025.2.9",
    "ruff>=0.9.9",
    "tomli>=2.0.1",
]
test = [
    "pytest>=8.3.4",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100",
]
examples = [
    "fastapi>=0.115.10",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pyjwt>=2.9.0",
]
build = [
    "setuptools>=77",
    "wheel",
    "setuptools-scm>=8",
]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
# examples/ is demo code using intentional FastAPI idioms (Depends() in
# defaults, B904/B008/E501/E402); tests/ is excluded from lint by design.
exclude = ["tests/", "examples/"]

[tool.ruff.lint]
ignore = ["F811"]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# noxfile.py is a build-tooling file: mutable `{}` sentinel defaults (B006),
# an unused loop var (B007) and long logging lines (E501) are intentional.
"noxfile.py" = ["B006", "B007", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
files = ["src/conditional_method", "src/cfg"]
exclude = ["src/conditional_method/_c.c"]

[tool.coverage.run]
source = ["conditional_method"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.cibuildwheel]
build = "cp39-*"
archs = ["x86_64", "aarch64", "i686", "ppc64le", "s390x", "armv7l"]

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64", "i686", "ppc64le", "s390x", "armv7l"]

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64", "x86"]
