# Release workflow: sdist + abi3 wheel matrix + GitHub Release + PyPI.
#
# Manual-trigger (workflow_dispatch with a tag) or tag push (v*). Builds the
# sdist + the full abi3 wheel matrix, validates them, creates a GitHub
# Release with the artifacts, and publishes to PyPI via TRUSTED PUBLISHING
# (OIDC) as "conditional-method" — no credentials/tokens are stored in the repo.
#
# The package version is derived from the git tag by setuptools-scm
# (dynamic versioning): tag v0.2.0 -> version 0.2.0.
#
# Trusted publishing setup (maintainer, one-time, on PyPI):
#   1. Register the project "conditional-method" on PyPI (and/or TestPyPI).
#   2. Add a "publishing source": GitHub Actions, owner jymchng, repo
#      conditional-method, workflow "release.yml", environment "release".
#   3. The publish job below then authenticates via OIDC with no secrets.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write  # GitHub Release (scoped)
  id-token: write  # OIDC for PyPI trusted publishing

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Verify sdist version (setuptools-scm)
        run: |
          python - <<'EOF'
          import glob, tarfile, re
          sd = glob.glob("dist/*.tar.gz")[0]
          print(f"sdist: {sd}")
          with tarfile.open(sd) as t:
              names = t.getnames()
          # First entry is the sdist root dir, e.g. conditional_method-0.2.0
          m = re.match(r"conditional_method-([^/]+)", names[0])
          assert m, names[:5]
          print(f"version from tag: {m.group(1)}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheel (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: ubuntu-latest
            arch: i686
          - os: ubuntu-latest
            arch: ppc64le
          - os: ubuntu-latest
            arch: s390x
          - os: ubuntu-latest
            arch: armv7l
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: ARM64
          - os: windows-latest
            arch: x86
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU (cross-arch Linux builds)
        if: runner.os == 'Linux' && matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          output-dir: dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  build_pyodide_wheel:
    name: Build pyodide wheel (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build pyodide (emscripten wasm32) wheel
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp313-pyodide_wasm32
          # Override [tool.cibuildwheel] archs (native archs are invalid for
          # pyodide; wasm32 is the only supported arch).
          CIBW_ARCHS: wasm32
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: dist
          # Pin pyodide 314.0.3 (Emscripten 5.0.3) — the version the AsyncMove
          # playground loads (jsdelivr "latest"). Without this, the wheel is
          # tagged pyemscripten_2025_0_wasm32 and micropip rejects it against
          # a 5.0.3 runtime: "Wheel was built with Emscripten vpyemscripten.2025.0
          # but Pyodide was built with Emscripten v5.0.3".
          pyodide-version: 314.0.3

      - name: Retag pyodide wheel for micropip (emscripten_<ver>_wasm32)
        env:
          # Real Emscripten version of the pinned pyodide xbuildenv. Used as a
          # fallback if the cache lookup below finds nothing; keep in sync with
          # pyodide-version above.
          PYODIDE_EMSCRIPTEN_VERSION: "5.0.3"
        run: |
          set -euo pipefail
          # Derive the Emscripten version from the xbuildenv that cibuildwheel
          # just installed (authoritative: it is the exact toolchain the wheel
          # was compiled with). Fall back to the env var above.
          # NOTE: keep '*314.0.3*' in sync with pyodide-version above.
          MKFILE=$(find "$HOME/.cache/cibuildwheel" -type f -name Makefile.envs \
            -path '*pyodide-build-*' -path '*314.0.3*' \
            -path '*/xbuildenv/pyodide-root/Makefile.envs' 2>/dev/null | head -n1 || true)
          if [ -n "$MKFILE" ]; then
            # Makefile.envs uses 'export PYODIDE_EMSCRIPTEN_VERSION ?= 5.0.3'
            # (?= means "set if not already defined"); also tolerate '='.
            PYODIDE_EMSCRIPTEN_VERSION=$(sed -n 's/^export *PYODIDE_EMSCRIPTEN_VERSION[^=]*= *//p' "$MKFILE" \
              | tr -d "\"'" | tail -n1)
          fi
          echo "Emscripten version: ${PYODIDE_EMSCRIPTEN_VERSION:-<unset>}"
          # pyodide-build tags wheels pyemscripten_<abi>_wasm32, but micropip's
          # platform_to_version() only strips the emscripten_ prefix -> the tag
          # must be emscripten_<real_emscripten_version>_wasm32 to install.
          python scripts/retag_pyodide_wheel.py \
            --emscripten-version "$PYODIDE_EMSCRIPTEN_VERSION" dist/*.whl
          # Drop the original pyemscripten_*_wasm32 wheel (micropip rejects it).
          rm -f dist/*pyemscripten*.whl

      - name: Verify pyodide wheel tag (must be emscripten_*_wasm32)
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheels = [f for f in glob.glob("dist/*.whl") if "emscripten" in f]
          assert len(wheels) == 1, f"expected exactly one emscripten wheel, got {wheels}"
          w = wheels[0]
          assert "pyemscripten" not in w, f"wheel still tagged pyemscripten: {w}"
          with zipfile.ZipFile(w) as z:
              meta = [n for n in z.namelist() if n.endswith("WHEEL")][0]
              tag = z.read(meta).decode()
          assert "pyemscripten" not in tag, f"WHEEL still tagged pyemscripten:\n{tag}"
          assert "emscripten_" in tag, f"no emscripten tag in WHEEL:\n{tag}"
          print(f"OK: {w}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pyodide
          path: dist/*emscripten*.whl

  github_release:
    name: Create GitHub Release
    needs: [build_sdist, build_wheels, build_pyodide_wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - name: Verify artifact integrity + count
        run: |
          python - <<'EOF'
          import hashlib, glob, zipfile
          files = sorted(glob.glob("dist/*"))
          assert files, "no artifacts"
          for f in files:
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              print(f"{f}: {h}")
          print(f"total artifacts: {len(files)}")
          assert any(f.endswith(".tar.gz") for f in files), "missing sdist"
          whls = [f for f in files if f.endswith(".whl")]
          assert len(whls) >= 10, f"expected >=10 wheels, got {len(whls)}"
          assert any("emscripten" in f and "pyemscripten" not in f for f in whls), "missing correctly-tagged pyodide wheel"
          # Every native wheel must carry the cp39-abi3 tag (stable ABI).
          for w in whls:
              if "emscripten" in w:
                  continue
              with zipfile.ZipFile(w) as z:
                  wheel_meta = [n for n in z.namelist() if n.endswith("WHEEL")][0]
                  tag = z.read(wheel_meta).decode()
                  assert "cp39-abi3" in tag, f"bad tag in {w}:\n{tag}"
          EOF

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --title "conditional-method $TAG" \
            --repo "${{ github.repository }}"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/* \
            --clobber \
            --repo "${{ github.repository }}"
          echo "Uploaded:"
          ls -1 dist/

  publish:
    # Publish to PyPI ("conditional-method") via trusted publishing (OIDC).
    needs: [build_sdist, build_wheels, build_pyodide_wheel]
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
