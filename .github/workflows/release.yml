# Release workflow: sdist + abi3 wheel matrix + GitHub Release + PyPI.
#
# Manual-trigger (workflow_dispatch with a tag) or tag push (v*). Builds the
# sdist + the full abi3 wheel matrix, validates them, creates a GitHub
# Release with the artifacts, and publishes to PyPI via TRUSTED PUBLISHING
# (OIDC) as "conditional-method" — no credentials/tokens are stored in the repo.
#
# The package version is derived from the git tag by setuptools-scm
# (dynamic versioning): tag v0.2.0 -> version 0.2.0.
#
# Trusted publishing setup (maintainer, one-time, on PyPI):
#   1. Register the project "conditional-method" on PyPI (and/or TestPyPI).
#   2. Add a "publishing source": GitHub Actions, owner OWNER, repo
#      conditional-method, workflow "release.yml", environment "release".
#   3. The publish job below then authenticates via OIDC with no secrets.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write  # GitHub Release (scoped)
  id-token: write  # OIDC for PyPI trusted publishing

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Verify sdist version (setuptools-scm)
        run: |
          python - <<'EOF'
          import glob, tarfile, re
          sd = glob.glob("dist/*.tar.gz")[0]
          print(f"sdist: {sd}")
          with tarfile.open(sd) as t:
              names = t.getnames()
          # First entry is the sdist root dir, e.g. conditional_method-0.2.0
          m = re.match(r"conditional_method-([^/]+)", names[0])
          assert m, names[:5]
          print(f"version from tag: {m.group(1)}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheel (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Limit simultaneous runners: GitHub-hosted provisioning intermittently
      # fails with 'Set up job' errors when many matrix jobs start at once.
      max-parallel: 6
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: ubuntu-latest
            arch: i686
          - os: ubuntu-latest
            arch: ppc64le
          - os: ubuntu-latest
            arch: s390x
          - os: ubuntu-latest
            arch: armv7l
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: ARM64
          - os: windows-latest
            arch: x86
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU (cross-arch Linux builds)
        if: runner.os == 'Linux' && matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          output-dir: dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  build_pyodide_wheel:
    name: Build pyodide wheel (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build pyodide (emscripten wasm32) wheel
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp313-pyodide_wasm32
          # Override [tool.cibuildwheel] archs (native archs are invalid for
          # pyodide; wasm32 is the only supported arch).
          CIBW_ARCHS: wasm32
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: dist
          # cibuildwheel's default pyodide xbuildenv is used (pyodide-build
          # 0.39.0 flags the 314.0.3 xbuildenv as incompatible, so it must NOT
          # be pinned). The produced wheel is tagged pyemscripten_2025_0_wasm32;
          # the re-tag step below fixes it for the playground's 2026_0 ABI.

      - name: Re-tag pyodide wheel to pyemscripten_2026_0_wasm32
        env:
          PYODIDE_EMSCRIPTEN_VERSION: "5.0.3"
        run: |
          set -euo pipefail
          ls -1 dist/
          # cibuildwheel 4.2.0's pyodide build tags the wheel
          # pyemscripten_2025_0_wasm32 (its default xbuildenv), but the
          # AsyncMove playground runtime (pyodide 314.0.3) reports ABI 2026_0,
          # so micropip 0.11.1 rejects 2025_0. The binary is already compiled
          # with Emscripten 5.0.3 (ABI-compatible), so we re-tag it:
          #   - the wheel -> pyemscripten_2026_0_wasm32, which is what BOTH
          #     PyPI and the GitHub Release carry (so GitHub matches PyPI
          #     file-for-file; there is no separate GitHub-only
          #     emscripten_5_0_3_wasm32 variant anymore).
          python - <<'EOF'
          import zipfile, base64, hashlib, glob

          def retag(src, dst, old, new):
              with zipfile.ZipFile(src) as z:
                  entries = {n: z.read(n) for n in z.namelist()}
              wm = [n for n in entries if n.endswith("WHEEL")][0]
              rm = [n for n in entries if n.endswith("RECORD")][0]
              nw = entries[wm].decode().replace(old, new)
              with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as z:
                  for n, data in entries.items():
                      if n == wm:
                          data = nw.encode()
                      if n == rm:
                          continue
                      z.writestr(n, data)
                  rec = []
                  for n, data in [(k, v) for k, v in entries.items() if k != rm]:
                      if n == wm:
                          data = nw.encode()
                      d = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode()
                      rec.append(f"{n},sha256={d},{len(data)}")
                  z.writestr(rm, ("\n".join(rec) + "\n" + f"{rm},,\n").encode())

          whls = glob.glob("dist/*.whl")
          assert len(whls) == 1, whls
          src = whls[0]
          pypi = src.replace("pyemscripten_2025_0_wasm32", "pyemscripten_2026_0_wasm32")
          retag(src, pypi, "pyemscripten_2025_0_wasm32", "pyemscripten_2026_0_wasm32")
          # drop the untagged original
          import os
          os.remove(src)
          print("wrote:", pypi)
          EOF

      - name: Verify pyodide wheel tag (pyemscripten_2026_0_wasm32)
        run: |
          python - <<'EOF'
          import glob, zipfile
          whls = [f for f in glob.glob("dist/*.whl") if "pyemscripten" in f]
          assert len(whls) == 1, f"expected exactly one pyemscripten wheel, got {whls}"
          def tag_of(w):
              with zipfile.ZipFile(w) as z:
                  meta = [n for n in z.namelist() if n.endswith("WHEEL")][0]
                  return z.read(meta).decode()
          assert "pyemscripten_2026_0_wasm32" in tag_of(whls[0]), tag_of(whls[0])
          print(f"OK pyemscripten: {whls[0]}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pyodide
          path: dist/*pyemscripten*.whl

  github_release:
    name: Create GitHub Release
    needs: [build_sdist, build_wheels, build_pyodide_wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - name: Verify artifact integrity + count
        run: |
          python - <<'EOF'
          import hashlib, glob, zipfile
          files = sorted(glob.glob("dist/*"))
          assert files, "no artifacts"
          for f in files:
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              print(f"{f}: {h}")
          print(f"total artifacts: {len(files)}")
          assert any(f.endswith(".tar.gz") for f in files), "missing sdist"
          whls = [f for f in files if f.endswith(".whl")]
          assert len(whls) >= 11, f"expected >=11 wheels (native + pyodide variants), got {len(whls)}"
          # The single pyodide wasm wheel is pyemscripten_2026_0_wasm32; it is
          # what both PyPI and the GitHub Release carry, so the set matches
          # PyPI file-for-file (no separate GitHub-only emscripten variant).
          assert any("pyemscripten" in f for f in whls), "missing pyodide pyemscripten wheel"
          # Every native wheel must carry the cp39-abi3 tag (stable ABI).
          for w in whls:
              if "emscripten" in w:
                  continue
              with zipfile.ZipFile(w) as z:
                  wheel_meta = [n for n in z.namelist() if n.endswith("WHEEL")][0]
                  tag = z.read(wheel_meta).decode()
                  assert "cp39-abi3" in tag, f"bad tag in {w}:\n{tag}"
          EOF

      - name: Delete existing release for tag (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # Keep the tag; only drop any previous release for it so re-runs of
          # the same tag (e.g. after a pipeline fix) recreate cleanly.
          gh release delete "$TAG" --yes 2>/dev/null || true

      - name: Create GitHub Release (published, not draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --generate-notes \
            --title "conditional-method $TAG" \
            --repo "${{ github.repository }}"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/* \
            --clobber \
            --repo "${{ github.repository }}"
          echo "Uploaded:"
          ls -1 dist/

  publish:
    # Publish to PyPI ("conditional-method") via trusted publishing (OIDC).
    needs: [build_sdist, build_wheels, build_pyodide_wheel]
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - name: Verify only the pyemscripten_2026_0_wasm32 wasm wheel is present (no GitHub-only variant)
        run: |
          # The pipeline now produces a single pyodide wheel:
          # pyemscripten_2026_0_wasm32, which is what both PyPI and the
          # GitHub Release carry (so the sets match file-for-file). Defensive
          # guard: fail if an unexpected non-py emscripten_* variant ever
          # appears so it can never reach GitHub or PyPI.
          set -euo pipefail
          if ls dist/*-emscripten_*.whl >/dev/null 2>&1; then
            echo "unexpected non-py emscripten variant present:" >&2
            ls -1 dist/*-emscripten_*.whl >&2
            exit 1
          fi
          ls -1 dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
