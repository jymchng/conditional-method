---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: ruff check
        run: uvx ruff check .
      - name: ruff format check
        run: uvx ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Build C extension (with test fault-injection hooks)
        run: |
          uv sync --group build --group test
          CFLAGS="-DPY_CFG_TESTING" uv run python setup.py build_ext --inplace

      - name: Run test suite
        run: uv run --group test python -m pytest tests -q

      - name: Verify wheel builds (cp39-abi3)
        run: |
          uv build --wheel
          ls dist/*.whl

  coverage:
    name: C coverage gate (gcov >90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Check gcov availability
        run: gcov --version | head -1
      - name: Run C coverage gate
        run: bash scripts/coverage-gate.sh

  sanitizers:
    name: Sanitizers (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Check libasan availability
        run: cc -print-file-name=libasan.so
      - name: Run ASan/UBSan gate
        run: bash scripts/sanitize-gate.sh
